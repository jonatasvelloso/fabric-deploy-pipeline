name: CI

# Todo pull request: lint, testes e validação do workspace, sem credenciais.
# PR para develop também mostra o plano contra o workspace de DEV.

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, testes e validação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -v
      - name: Validar workspace
        run: fabric-deploy validate

  plan-dev:
    name: Plano contra DEV
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && !github.event.pull_request.head.repo.fork
    needs: checks
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Plano (dry-run)
        env:
          FAB_TENANT_ID: ${{ secrets.FAB_TENANT_ID }}
          FAB_CLIENT_ID: ${{ secrets.FAB_CLIENT_ID }}
          FAB_CLIENT_SECRET: ${{ secrets.FAB_CLIENT_SECRET }}
          FABRIC_WORKSPACE: ${{ secrets.FABRIC_WORKSPACE }}
        run: fabric-deploy plan --env dev --base-ref ${{ github.event.pull_request.base.sha }}
